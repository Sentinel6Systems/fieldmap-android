// Fieldmap over a Meshtastic mesh: what one device sends to the others of its server.
//
// Sent as the payload of a Meshtastic Data message with portnum PRIVATE_APP (256), on the
// server's private channel only, to everybody (broadcast). One message per packet: a
// Meshtastic packet carries at most 233 bytes, and every byte is airtime on a shared radio.
syntax = "proto3";

package fieldmap;

option java_package = "io.github.sentinel6systems.fieldmap.mesh.proto";

message MeshMessage {
  oneof kind {
    MeshPosition position = 1;
    MeshMarker marker = 2;
    MeshText text = 3;
    MeshDelivered delivered = 4;
    // An arrow, as a MeshMarker with its head. Apart from `marker` so that an app from before
    // arrows does not take it for a plain marker (and pass that on).
    MeshMarker arrow = 5;
    // A route, apart for the same reason. Deleting one goes as a deleted `marker`.
    MeshRoute route = 6;
  }
}

// A device's own position, with who it is: the app's id (16 bytes when it is a UUID, as the
// app makes it; otherwise its text) and the display name of Location Sharing, so that the
// same person is one entry whether heard through the server or over the mesh.
message MeshPosition {
  bytes uid = 1;
  string name = 2;
  sfixed32 lat = 3;          // degrees * 1e7
  sfixed32 lon = 4;          // degrees * 1e7
  optional sint32 alt = 5;   // meters
  optional uint32 acc = 6;   // meters
  optional uint32 course = 7;  // degrees true
  optional uint32 speed = 8;   // cm/s; 0 while the device stays in one place
  uint32 time = 9;           // when the fix was taken, seconds since 1970
}

// A shared marker or arrow as it is now, or that it was deleted. The last change wins, by `updated`.
message MeshMarker {
  string id = 1;
  sfixed32 lat = 2;
  sfixed32 lon = 3;
  string label = 4;
  uint32 color = 5;          // 0xRRGGBB
  uint32 updated = 6;        // seconds since 1970
  bytes by = 7;              // the uid of the device that changed it last (as in MeshPosition)
  bool deleted = 8;
  // An arrow (the print tool's): lat/lon is its start, these its head.
  optional sfixed32 end_lat = 9;
  optional sfixed32 end_lon = 10;
}

// A shared route as it is now: the points tapped for it (each device draws the line through
// them), and the speed its time is worked out at. The last change wins, by `updated`. Up to 30
// points: the first exactly, the others as steps from the one before, in 1e-5 degrees (about
// 1 m), two bytes each for steps up to about 9 km.
message MeshRoute {
  string id = 1;
  string label = 2;          // left out when the route would not fit
  uint32 color = 3;          // 0xRRGGBB
  uint32 updated = 4;        // seconds since 1970
  bytes by = 5;              // the uid of the device that changed it last (as in MeshPosition)
  sfixed32 lat = 6;          // the first point, degrees * 1e7
  sfixed32 lon = 7;
  repeated sint32 steps = 8; // then each next point: lat step, lon step (degrees * 1e5)
  uint32 mph = 9;            // its speed (one of the app's choices)
}

// A short text message, to one device or to everybody. Sent straight to the radio of the device
// it is for when that radio is known (Meshtastic confirms it arrived), otherwise to everybody, so
// that a device that also reaches the server can pass it on there.
message MeshText {
  string id = 1;
  bytes from = 2;            // the sender's uid (as in MeshPosition)
  string name = 3;           // the sender's display name; left out when the message would not fit
  bytes to = 4;              // the uid it is for; empty: everybody
  string text = 5;           // at most 140 characters
  uint32 time = 6;           // when it was written, seconds since 1970
}

// Messages that reached a device, told to the device that sent them: messages to everybody and
// messages that went to every radio (Meshtastic confirms only those sent straight to a radio),
// and messages of a device on the mesh only that a relay passed on to the server.
message MeshDelivered {
  bytes to = 1;              // the uid of the device that sent them
  repeated string ids = 2;
  bytes by = 3;              // the uid of the device that has them (empty: the one they were for)
}
